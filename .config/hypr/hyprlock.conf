$font = BigBlueTerm437 Nerd Font

source = ~/.config/hypr/hyprlock_bg.conf

general {
  no_fade_in = false
  grace = 0
  disable_loading_bar = false
}

# time
label {
  monitor =
  text = cmd[update:1000] echo "<span>$TIME</span>"
  color = rgba(235, 219, 178, 1)
  font_size = 80
  font_family = $font
  position = 30, 60
  halign = center
  valign = center
}

# date
label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
  color = rgba(235, 219, 178, 1)
  font_size = 30
  font_family = $font
  position = 35, -30
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 320, 60
  dots_size = 0.25
  dots_spacing = 0.6
  dots_center = true
  inner_color = rgba(29, 32, 33, 0.4)
  font_color = rgba(189, 174, 147, 1)
  fade_on_empty = false
  rounding = 12
  outer_color = transparent
  font_family = $font
  placeholder_text = <span>    Enter Pass</span>
  hide_input = false
  position = 34, -180
  halign = center
  valign = center
  check_color = rgba(204, 36, 29, 1)
  fail_color = rgba(204, 36, 29, 1) # if authentication failed, changes outer_color and fail message color
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  fail_transition = 300 # transition time in ms between normal outer_color and fail_color
}
