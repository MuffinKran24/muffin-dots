[mgr]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[preview]
tab_size = 2

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
vlc = [
  { run = 'vlc "$@"', orphan = true, for = "unix" },
]
pdf = [
  { run = 'firefox "$@"', orphan = true, for = "unix" },
]
office = [
  { run = 'libreoffice "$@"', orphan = true, for = "unix" },
]
pictures = [
  { run = 'geeqie "$@"', orphan = true, for = "unix" },
]
play = [
  { run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
  { mime = "image/*", use = [ "pictures", "play" ] },
  { mime = "{audio,video}/*", use = [ "vlc", "play" ] },
  { mime = "application/pdf", use = [ "pdf", "play" ] },
    
  # LibreOffice
  { mime = "application/vnd.oasis.opendocument.*", use = [ "office", "play" ] },
  { mime = "application/vnd.openxmlformats-officedocument.*", use = [ "office", "play" ] },
    
  # Everything else
  { mime = "*", use = [ "edit", "play" ] },
]
